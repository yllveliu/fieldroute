# Alembic configuration for FieldRoute.
#
# The database URL is intentionally NOT hardcoded here. It is injected at
# runtime from the DATABASE_URL environment variable in alembic/env.py
# (via app.core.config), keeping credentials out of version control.

[alembic]
# Path to the migration environment, relative to this file (the backend/ dir).
script_location = alembic

# Prepend the backend/ directory to sys.path so the `app` package is importable
# when running `alembic` from the backend folder.
prepend_sys_path = .

# sqlalchemy.url is set programmatically in env.py from DATABASE_URL.
# Left blank on purpose — do not commit real credentials here.
sqlalchemy.url =


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
